{% extends "base.html" %}

{% block content %}
<div x-data="playlistManager()" x-init="init()">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800">
            <i class="fas fa-list text-green-600 mr-3"></i>
            Gerenciar Playlists
        </h1>

        <button @click="showAddModal = true" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg shadow-md transition">
            <i class="fas fa-plus mr-2"></i>
            Criar Playlist
        </button>
    </div>

    <!-- Cards de Playlists -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-for="playlist in playlists" :key="playlist.id">
            <div class="bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex-1">
                        <h3 class="text-xl font-bold text-gray-800 mb-2" x-text="playlist.name"></h3>
                        <p class="text-sm text-gray-500" x-text="playlist.description || 'Sem descrição'"></p>
                    </div>
                    <button @click="deletePlaylist(playlist.id)" class="text-red-600 hover:text-red-900 transition ml-2">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>

                <div class="border-t pt-4">
                    <button @click="viewPlaylist(playlist.id)" class="text-green-600 hover:text-green-700 transition text-sm font-medium">
                        <i class="fas fa-eye mr-1"></i>
                        Ver Detalhes
                    </button>
                </div>
            </div>
        </template>

        <!-- Empty state -->
        <div x-show="playlists.length === 0" class="col-span-full">
            <div class="bg-white rounded-lg shadow-md p-12 text-center">
                <i class="fas fa-list text-gray-300 text-6xl mb-4"></i>
                <p class="text-gray-500 text-lg">Nenhuma playlist encontrada</p>
                <button @click="showAddModal = true" class="mt-4 text-green-600 hover:text-green-700 font-medium">
                    Criar sua primeira playlist
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Playlist -->
    <div x-show="showAddModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="showAddModal = false">
        <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Criar Nova Playlist</h2>

            <form @submit.prevent="addPlaylist()">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nome</label>
                    <input
                        x-model="newPlaylist.name"
                        type="text"
                        required
                        placeholder="Ex: Favoritas"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                    >
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Descrição (opcional)</label>
                    <textarea
                        x-model="newPlaylist.description"
                        placeholder="Descrição da playlist..."
                        rows="3"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                    ></textarea>
                </div>

                <div class="flex gap-4">
                    <button
                        type="button"
                        @click="showAddModal = false"
                        class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg transition"
                    >
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        class="flex-1 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition"
                    >
                        <i class="fas fa-plus mr-2"></i>
                        Criar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ver Playlist -->
    <div x-show="showViewModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" @click.self="showViewModal = false">
        <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-2xl max-h-[80vh] overflow-y-auto">
            <template x-if="currentPlaylist">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 mb-4" x-text="currentPlaylist.name"></h2>
                    <p class="text-gray-600 mb-6" x-text="currentPlaylist.description"></p>

                    <h3 class="text-lg font-bold text-gray-700 mb-3">
                        <i class="fas fa-music mr-2"></i>
                        Áudios (<span x-text="currentPlaylist.audios?.length || 0"></span>)
                    </h3>

                    <div class="space-y-2">
                        <template x-for="audio in currentPlaylist.audios" :key="audio.id">
                            <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg">
                                <div>
                                    <span class="font-medium text-gray-800" x-text="audio.command"></span>
                                    <p class="text-xs text-gray-500" x-text="audio.file_path"></p>
                                </div>
                                <span class="text-sm text-gray-500" x-text="'#' + (audio.position + 1)"></span>
                            </div>
                        </template>

                        <!-- Empty -->
                        <div x-show="!currentPlaylist.audios || currentPlaylist.audios.length === 0" class="text-center py-8 text-gray-500">
                            <i class="fas fa-music text-3xl mb-2"></i>
                            <p>Playlist vazia</p>
                        </div>
                    </div>

                    <button
                        @click="showViewModal = false"
                        class="mt-6 w-full bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg transition"
                    >
                        Fechar
                    </button>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function playlistManager() {
    return {
        playlists: [],
        currentPlaylist: null,
        showAddModal: false,
        showViewModal: false,
        newPlaylist: {
            name: '',
            description: '',
            guild_id: 0
        },

        async init() {
            await this.loadPlaylists();
        },

        async loadPlaylists() {
            try {
                const response = await fetch('/api/playlists?guild_id=0');
                this.playlists = await response.json();
            } catch (error) {
                console.error('Erro ao carregar playlists:', error);
                alert('Erro ao carregar playlists');
            }
        },

        async addPlaylist() {
            try {
                const response = await fetch('/api/playlists', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.newPlaylist)
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.detail || 'Erro ao criar playlist');
                    return;
                }

                this.newPlaylist = { name: '', description: '', guild_id: 0 };
                this.showAddModal = false;
                await this.loadPlaylists();
                alert('✓ Playlist criada com sucesso!');
            } catch (error) {
                console.error('Erro ao criar playlist:', error);
                alert('Erro ao criar playlist');
            }
        },

        async deletePlaylist(id) {
            if (!confirm('Tem certeza que deseja excluir esta playlist?')) return;

            try {
                const response = await fetch(`/api/playlists/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await this.loadPlaylists();
                    alert('✓ Playlist excluída com sucesso!');
                } else {
                    alert('Erro ao excluir playlist');
                }
            } catch (error) {
                console.error('Erro ao excluir playlist:', error);
                alert('Erro ao excluir playlist');
            }
        },

        async viewPlaylist(id) {
            try {
                const response = await fetch(`/api/playlists/${id}`);
                this.currentPlaylist = await response.json();
                this.showViewModal = true;
            } catch (error) {
                console.error('Erro ao carregar playlist:', error);
                alert('Erro ao carregar playlist');
            }
        }
    }
}
</script>
{% endblock %}
