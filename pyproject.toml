[project]
name = "cazalberto"
description = "Bot de Discord para tocar clipes de áudio e trilhas do World of Warcraft"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Gregorio" }]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "discord.py[voice]>=2.4,<3",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
cazalberto = "cazalberto.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "cazalberto.__version__" }

[tool.setuptools.packages.find]
include = ["cazalberto*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # o ruff format cuida do tamanho das linhas; textos longos são aceitos
    "RUF001", "RUF002", "RUF003",  # emojis e acentos nas mensagens são intencionais
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
