[tool.poetry]
name = "cazalberto"
version = "2.0.0"
description = "Bot Discord moderno para reprodução de áudio e entretenimento"
authors = ["Daniel Gregorio <danielgregorio@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "cazalberto", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
discord-py = "^2.3.2"
python-dotenv = "^1.0.0"
aiohttp = "^3.9.3"
aiofiles = "^23.2.1"
ffmpeg-python = "^0.2.0"
PyNaCl = "^1.5.0"
requests = "^2.31.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
aiosqlite = "^0.19.0"
alembic = "^1.13.1"

# Validação e configuração
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"

# Web Panel
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
jinja2 = "^3.1.3"
python-multipart = "^0.0.6"

# HTTP client moderno
httpx = "^0.26.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.4"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"

# Code quality
black = "^23.12.1"
isort = "^5.13.2"
ruff = "^0.1.13"
mypy = "^1.8.0"

# Pre-commit
pre-commit = "^3.6.0"

# Type stubs
types-aiofiles = "^23.2.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
cazalberto = "cazalberto.bot:main"
cazalberto-web = "cazalberto.web.app:main"
cazalberto-migrate = "cazalberto.scripts.migrate:main"

# Configuração do Black
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # diretórios
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# Configuração do isort
[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["cazalberto"]

# Configuração do mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "discord.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ffmpeg.*"
ignore_missing_imports = true

# Configuração do Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# Configuração do pytest
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=src/cazalberto",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

# Configuração de cobertura
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
