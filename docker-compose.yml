services:
  cazalberto:
    build: .
    container_name: cazalberto-bot
    env_file: .env
    environment:
      # Caminhos dentro do container (não mude); as pastas do seu computador ficam nos volumes.
      DATA_DIR: /app/data
      AUDIO_DIR: /app/audio_clips
      WOW_OST_DIR: /app/wow-ost
      LOG_FILE: ""
    volumes:
      - ./data:/app/data
      - ./audio_clips:/app/audio_clips
      # Pasta das trilhas do WoW no seu computador (opcional). Defina WOW_OST_HOST_DIR no .env.
      - ${WOW_OST_HOST_DIR:-./wow-music}:/app/wow-ost:ro
    restart: unless-stopped
